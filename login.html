<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Sistem Bahan Ajar UT</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <h2>📚 Sistem Bahan Ajar</h2>
      <p class="logo-text">Universitas Terbuka</p>
      
      <div id="alertBox" class="alert alert-error hidden">
        <span>⚠️</span>
        <span id="alertMessage"></span>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Masukkan email Anda" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Masukkan password Anda" required>
        </div>
        <button type="submit" class="btn-login">Login</button>
      </form>

      <div class="login-links">
        <a href="#" id="btnLupaPassword">Lupa Password?</a>
        <a href="#" id="btnDaftar">Daftar Akun Baru</a>
      </div>
    </div>
  </div>

  <!-- Modal Lupa Password -->
  <div class="modal-overlay" id="modalLupaPassword">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal('modalLupaPassword')">&times;</button>
      <h3>🔑 Lupa Password</h3>
      <p style="color:#666; margin-bottom:20px;">Masukkan email Anda untuk mereset password.</p>
      <div class="form-group">
        <label for="resetEmail">Email</label>
        <input type="email" id="resetEmail" placeholder="Masukkan email terdaftar">
      </div>
      <button class="btn-login" onclick="resetPassword()">Kirim Link Reset</button>
      <div id="resetAlert" class="alert alert-success hidden" style="margin-top:15px;">
        <span>✅</span>
        <span>Link reset password telah dikirim ke email Anda.</span>
      </div>
    </div>
  </div>

  <!-- Modal Daftar -->
  <div class="modal-overlay" id="modalDaftar">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal('modalDaftar')">&times;</button>
      <h3>📝 Daftar Akun Baru</h3>
      <div class="form-group">
        <label for="regNama">Nama Lengkap</label>
        <input type="text" id="regNama" placeholder="Masukkan nama lengkap">
      </div>
      <div class="form-group">
        <label for="regEmail">Email</label>
        <input type="email" id="regEmail" placeholder="Masukkan email">
      </div>
      <div class="form-group">
        <label for="regPassword">Password</label>
        <input type="password" id="regPassword" placeholder="Buat password">
      </div>
      <div class="form-group">
        <label for="regKonfirmasi">Konfirmasi Password</label>
        <input type="password" id="regKonfirmasi" placeholder="Ulangi password">
      </div>
      <button class="btn-login" onclick="daftarAkun()">Daftar</button>
      <div id="daftarAlert" class="alert hidden" style="margin-top:15px;">
        <span id="daftarAlertIcon"></span>
        <span id="daftarAlertMessage"></span>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
